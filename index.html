    // --- SISTEMA DE SÍNTESE SONORA E SONS DE ANIMAIS ---
    class SensoryAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPop(pitchMultiplier = 1) {
        if (this.isMuted) return;
        const baseFreq = 320 * pitchMultiplier;
        this.playTone(baseFreq, 'sine', 0.15, 0.12);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.08);
          }, index * 90);
        });
      }

      playAnimalSound(type) {
        if (this.isMuted) return;
        this.init();
        const now = this.ctx.currentTime;
        
        switch (type) {
          case 'cavalo':
            for (let i = 0; i < 4; i++) {
              setTimeout(() => {
                this.playTone(600 - (i * 80), 'sawtooth', 0.1, 0.15);
              }, i * 60);
            }
            break;
          case 'vaca':
            this.playTone(130, 'triangle', 0.9, 0.2);
            break;
          case 'cachorro':
            this.playTone(280, 'sawtooth', 0.15, 0.2);
            setTimeout(() => this.playTone(320, 'sawtooth', 0.15, 0.2), 200);
            break;
          case 'gato':
            this.playTone(550, 'sine', 0.2, 0.15);
            setTimeout(() => this.playTone(450, 'sine', 0.3, 0.15), 180);
            break;
          case 'leao':
            this.playTone(90, 'sawtooth', 0.8, 0.3);
            break;
          case 'elefante':
            this.playTone(450, 'sawtooth', 0.6, 0.25);
            break;
          case 'galo':
            this.playTone(500, 'sine', 0.2, 0.2);
            setTimeout(() => this.playTone(750, 'sine', 0.4, 0.25), 200);
            break;
          case 'ovelha':
            this.playTone(220, 'sawtooth', 0.5, 0.2);
            break;
          case 'pato':
            this.playTone(300, 'square', 0.15, 0.15);
            setTimeout(() => this.playTone(280, 'square', 0.15, 0.15), 150);
            break;
          case 'porco':
            this.playTone(180, 'square', 0.1, 0.2);
            setTimeout(() => this.playTone(160, 'square', 0.1, 0.2), 120);
            break;
          case 'macaco':
            this.playTone(600, 'sine', 0.1, 0.15);
            setTimeout(() => this.playTone(800, 'sine', 0.1, 0.15), 120);
            setTimeout(() => this.playTone(600, 'sine', 0.1, 0.15), 240);
            break;
          case 'coruja':
            this.playTone(350, 'sine', 0.3, 0.15);
            setTimeout(() => this.playTone(300, 'sine', 0.4, 0.15), 350);
            break;
          default:
            this.playPop();
        }
      }
    }
