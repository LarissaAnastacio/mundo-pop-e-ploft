    const { useState, useEffect, useRef } = React;

    // --- SÍNTESE ACÚSTICA PARA SONS DE ANIMAIS E EFEITOS ---
    class OrganicAnimalAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPop(pitchMultiplier = 1) {
        if (this.isMuted) return;
        const baseFreq = 320 * pitchMultiplier;
        this.playTone(baseFreq, 'sine', 0.15, 0.12);
      }

      playError() {
        if (this.isMuted) return;
        this.playTone(180, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.25, 0.15), 150);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.08);
          }, index * 90);
        });
      }

      createNoiseBuffer(duration = 1.0) {
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      playOrganicAnimalSound(type) {
        if (this.isMuted) return;
        this.init();
        const now = this.ctx.currentTime;

        try {
          switch (type) {
            case 'cavalo': {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              const lfo = this.ctx.createOscillator();
              const lfoGain = this.ctx.createGain();

              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(650, now);
              osc.frequency.linearRampToValueAtTime(950, now + 0.25);
              osc.frequency.exponentialRampToValueAtTime(400, now + 0.8);

              lfo.frequency.setValueAtTime(22, now);
              lfoGain.gain.setValueAtTime(120, now);
              lfo.connect(osc.frequency);

              gain.gain.setValueAtTime(0, now);
              gain.gain.linearRampToValueAtTime(0.25, now + 0.1);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              lfo.start(now);
              osc.start(now);
              lfo.stop(now + 0.85);
              osc.stop(now + 0.85);
              break;
            }
            case 'vaca': {
              const osc = this.ctx.createOscillator();
              const filter = this.ctx.createBiquadFilter();
              const gain = this.ctx.createGain();

              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(115, now);
              osc.frequency.linearRampToValueAtTime(135, now + 0.3);
              osc.frequency.linearRampToValueAtTime(95, now + 1.2);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(400, now);

              gain.gain.setValueAtTime(0, now);
              gain.gain.linearRampToValueAtTime(0.35, now + 0.15);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 1.25);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(now);
              osc.stop(now + 1.25);
              break;
            }
            case 'cachorro': {
              [0, 0.22].forEach((delay) => {
                const startTime = now + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(260, startTime);
                osc.frequency.exponentialRampToValueAtTime(130, startTime + 0.14);

                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.4, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + 0.15);
              });
              break;
            }
            case 'gato': {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(520, now);
              osc.frequency.linearRampToValueAtTime(720, now + 0.25);
              osc.frequency.exponentialRampToValueAtTime(380, now + 0.6);

              gain.gain.setValueAtTime(0, now);
              gain.gain.linearRampToValueAtTime(0.2, now + 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(now);
              osc.stop(now + 0.65);
              break;
            }
            default:
              this.playPop();
          }
        } catch (e) {
          console.error("Erro no som", e);
        }
      }
    }

      // --- ESTADOS DO JOGO COMO PEDIR AJUDA ---
      const [taskIndex, setTaskIndex] = useState(0);
      const [helpFeedback, setHelpFeedback] = useState(null);

      const currentHelpTask = helpTasksData[taskIndex];

      const handleHelpOptionClick = (option) => {

          audioSystem.playSuccess();
        } else {

          audioSystem.playError();

      const nextHelpTask = () => {

        setTaskIndex((prev) => (prev + 1) % helpTasksData.length);
      };

      // --- ESTADOS DA LOUSA MÁGICA (DESENHO LIVRE) ---
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [brushColor, setBrushColor] = useState('#4F46E5');
      const [brushSize, setBrushSize] = useState(6);
      const [isEraser, setIsEraser] = useState(false);

      useEffect(() => {
        if (activeModule === 'drawing-board' && canvasRef.current) {
          const canvas = canvasRef.current;
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = 380;
          const ctx = canvas.getContext('2d');
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }, [activeModule]);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        ctx.strokeStyle = isEraser ? '#FFFFFF' : brushColor;
        ctx.lineWidth = brushSize;
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
