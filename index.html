    class SensoryAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.selectedVoice = null;
        this.initVoices();
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      initVoices() {
        if (!('speechSynthesis' in window)) return;
        
        const loadVoice = () => {
          const voices = window.speechSynthesis.getVoices();
          const ptVoice = voices.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR') 
                       || voices.find(v => v.lang.startsWith('pt'));
          if (ptVoice) {
            this.selectedVoice = ptVoice;
          }
        };

        loadVoice();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoice;
        }
      }

      speak(text) {
        if (this.isMuted || !('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        if (this.selectedVoice) {
          utterance.voice = this.selectedVoice;
        }

        window.speechSynthesis.speak(utterance);
      }

      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPop(pitchMultiplier = 1) {
        if (this.isMuted) return;
        const baseFreq = 320 * pitchMultiplier;
        this.playTone(baseFreq, 'sine', 0.15, 0.12);
      }

      playError() {
        if (this.isMuted) return;
        this.playTone(180, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.25, 0.15), 150);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.08);
          }, index * 90);
        });
      }

      playAnimalSound(animalObj) {
        if (this.isMuted) return;
        this.init();

        const animalName = typeof animalObj === 'object' ? animalObj.name : animalObj;
        this.speak(animalName);
      }
    }

            <div className="fixed bottom-4 left-4 right-4 max-w-4xl mx-auto z-40">
              <div className="bg-white/95 backdrop-blur-md border-2 border-indigo-200 shadow-2xl rounded-3xl p-5 md:p-6 flex flex-col md:flex-row items-center justify-between gap-4 text-slate-800">

                  <h4 className="font-black text-base flex items-center justify-center md:justify-start gap-2">
                    <span>🛡️</span> Sua Privacidade no Mundo Pop! &amp; Ploft!
                  </h4>
                  <p className="text-xs md:text-sm text-slate-600 leading-relaxed">
                    Respeitamos a <strong>LGPD</strong> e a segurança infantil. Não coletamos dados pessoais. Usamos armazenamento local para salvar sua rotina e histórico de evolução, além de cookies do <strong>Google AdSense</strong> para manter o site gratuito.{' '}
                    <button 
                      onClick={() => setShowPrivacyModal(true)}
                      className="underline font-bold text-indigo-600 hover:text-indigo-800"
                    >
                      Ler Política de Privacidade
                    </button>.
                  </p>
                </div>

                <div className="flex flex-wrap items-center justify-center gap-2 shrink-0">
                  <button
                    onClick={() => handleAcceptLgpd('essential')}
                    className="px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-100 text-slate-700 font-bold text-xs md:text-sm hover:bg-slate-200 transition"
                  >
                    Apenas Essenciais
                  </button>
                  <button
                    onClick={() => handleAcceptLgpd('accepted')}
                    className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs md:text-sm hover:bg-indigo-700 shadow-md transition"
                  >
                    Aceitar e Continuar
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-sm opacity-80 py-4 border-t border-slate-200/40 space-y-2">
            <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-semibold">
              <button 
                onClick={() => setShowPrivacyModal(true)}
                className="underline hover:text-indigo-600 transition"
              >
                Política de Privacidade (LGPD)
              </button>
              <span>•</span>
              <button 
                onClick={() => setShowParentModal(true)}
                className="underline hover:text-indigo-600 transition"
              >
                Gerenciar Cookies e Dados
              </button>
            </div>
            <p>&copy; <span id="year"></span> Larissa da Silva Anastácio. Todos os direitos reservados.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
