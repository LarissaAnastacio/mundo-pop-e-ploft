<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pop! & Ploft!</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SISTEMA DE SÍNTESE SONORA SUAVE ---
    class SensoryAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPop(pitchMultiplier = 1) {
        if (this.isMuted) return;
        const baseFreq = 320 * pitchMultiplier;
        this.playTone(baseFreq, 'sine', 0.15, 0.12);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.08);
          }, index * 90);
        });
      }
    }

    const audioSystem = new SensoryAudio();

    function App() {
      const [supportLevel, setSupportLevel] = useState(2);
      const [themeMode, setThemeMode] = useState('pastel');
      const [isMuted, setIsMuted] = useState(false);
      const [reduceMotion, setReduceMotion] = useState(false);
      const [activeModule, setActiveModule] = useState('home');
      const [showParentModal, setShowParentModal] = useState(false);

      const [bubbles, setBubbles] = useState([]);
      useEffect(() => {
        const initialBubbles = Array.from({ length: 8 }).map((_, i) => ({
          id: Date.now() + i,
          x: 10 + (i * 11) % 80,
          y: 20 + (i * 15) % 60,
          size: 70 + (i % 3) * 20,
          color: ['#FCA5A5', '#93C5FD', '#86EFAC', '#FDE047', '#C084FC', '#F472B6'][i % 6]
        }));
        setBubbles(initialBubbles);
      }, []);

      const emotionsData = [
        { id: 'happy', emoji: '😊', label: 'Feliz', desc: 'Quando nos sentimos sorridentes e contentes' },
        { id: 'sad', emoji: '😢', label: 'Triste', desc: 'Quando precisamos de um abraço ou descanso' },
        { id: 'calm', emoji: '😌', label: 'Calmo', desc: 'Quando nosso corpo está tranquilo e relaxado' },
        { id: 'angry', emoji: '😡', label: 'Bravo', desc: 'Quando algo incomoda e precisamos respirar fundo' }
      ];
      const [selectedEmotion, setSelectedEmotion] = useState(emotionsData[0]);

      const initialRoutines = [
        { id: 1, title: 'Acordar e Espreguiçar', time: 'Manhã', icon: '🌅', completed: false },
        { id: 2, title: 'Escovar os Dentes', time: 'Manhã', icon: '🪥', completed: false },
        { id: 3, title: 'Tomar Café da Manhã', time: 'Manhã', icon: '🥣', completed: false },
        { id: 4, title: 'Lavar as Mãos', time: 'Dia', icon: '🧼', completed: false }
      ];
      const [routines, setRoutines] = useState(initialRoutines);

      const colorItems = [
        { id: 'r1', color: 'bg-rose-400 border-rose-500', name: 'Vermelho' },
        { id: 'b1', color: 'bg-sky-400 border-sky-500', name: 'Azul' },
        { id: 'g1', color: 'bg-emerald-400 border-emerald-500', name: 'Verde' }
      ];
      const [itemsToSort, setItemsToSort] = useState(colorItems);

      useEffect(() => {
        audioSystem.isMuted = isMuted;
      }, [isMuted]);

      const createBubble = (x, y) => {
        const colors = ['#FCA5A5', '#93C5FD', '#86EFAC', '#FDE047', '#C084FC', '#F472B6'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        const newBubble = {
          id: Date.now() + Math.random(),
          x: x || Math.random() * 80 + 10,
          y: y || Math.random() * 70 + 15,
          size: supportLevel === 3 ? 100 : supportLevel === 2 ? 75 : 60,
          color: randomColor
        };
        setBubbles(prev => [...prev.slice(-18), newBubble]);
      };

      const handleBubbleClick = (id) => {
        audioSystem.playPop(0.8 + Math.random() * 0.5);
        setBubbles(prev => prev.filter(b => b.id !== id));
      };

      const completeRoutine = (id) => {
        setRoutines(routines.map(r => r.id === id ? { ...r, completed: !r.completed } : r));
        audioSystem.playSuccess();
      };

      const sortItem = (item, targetColor) => {
        if (item.name === targetColor) {
          audioSystem.playSuccess();
          setItemsToSort(itemsToSort.filter(i => i.id !== item.id));
        } else {
          audioSystem.playTone(220, 'sine', 0.2, 0.05);
        }
      };

      const getThemeClass = () => {
        if (themeMode === 'dark') return 'bg-slate-900 text-slate-100';
        if (themeMode === 'contrast') return 'bg-black text-yellow-300 font-bold';
        return 'bg-amber-50/60 text-slate-800';
      };

      const getCardStyle = () => {
        if (themeMode === 'dark') return 'bg-slate-800 border-slate-700 text-white';
        if (themeMode === 'contrast') return 'bg-zinc-900 border-4 border-yellow-400 text-yellow-300';
        return 'bg-white/90 backdrop-blur-md border-amber-100 shadow-md text-slate-700';
      };

      return (
        <div className={`min-h-screen ${getThemeClass()} transition-colors duration-300 flex flex-col justify-between p-4 md:p-8`}>
          <div>
            <header className="flex flex-wrap items-center justify-between gap-4 mb-6 max-w-6xl mx-auto">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setActiveModule('home')} 
                  className="text-2xl font-black tracking-tight bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent hover:scale-105 transition-transform"
                >
                  Mundo Pop! & Ploft!
                </button>
                <span className="text-xs px-2 py-1 rounded-full bg-indigo-100 text-indigo-700 font-bold">
                  Nível {supportLevel}
                </span>
              </div>

              <div className="flex items-center gap-2">
                {activeModule !== 'home' && (
                  <button 
                    onClick={() => setActiveModule('home')}
                    className="p-3 rounded-xl border bg-slate-100 font-bold hover:bg-slate-200 transition"
                  >
                    🏠 Início
                  </button>
                )}
                <button 
                  onClick={() => setIsMuted(!isMuted)}
                  className="p-3 rounded-xl border font-semibold transition"
                >
                  {isMuted ? '🔇 Mudo' : '🔊 Som OK'}
                </button>
                <button 
                  onClick={() => setShowParentModal(true)}
                  className="p-3 rounded-xl border bg-indigo-50 text-indigo-700 font-semibold hover:bg-indigo-100 transition"
                >
                  ⚙️ Ajustes
                </button>
              </div>
            </header>

            <main className="max-w-6xl mx-auto">
              {activeModule === 'home' && (
                <div className="space-y-8">
                  <div 
                    onClick={(e) => {
                      const rect = e.currentTarget.getBoundingClientRect();
                      createBubble(((e.clientX - rect.left) / rect.width) * 90, ((e.clientY - rect.top) / rect.height) * 80);
                    }}
                    className={`relative overflow-hidden min-h-[220px] rounded-3xl border-4 border-dashed border-pink-300 ${getCardStyle()} p-6 flex flex-col items-center justify-center cursor-pointer select-none`}
                  >
                    {bubbles.map(b => (
                      <button
                        key={b.id}
                        onClick={(e) => {
                          e.stopPropagation();
                          handleBubbleClick(b.id);
                        }}
                        style={{
                          left: `${b.x}%`,
                          top: `${b.y}%`,
                          width: `${b.size}px`,
                          height: `${b.size}px`,
                          backgroundColor: b.color
                        }}
                        className={`absolute rounded-full shadow-lg border-2 border-white/60 hover:scale-110 active:scale-90 transition-transform ${reduceMotion ? '' : 'animate-bounce'}`}
                      />
                    ))}
                    <h1 className="text-3xl md:text-5xl font-black text-center mb-2 z-10 drop-shadow-sm">
                      Mundo Pop! & Ploft!
                    </h1>
                    <p className="text-center font-medium opacity-80 z-10">
                      Clique em qualquer lugar para criar e estourar bolhas! 🫧
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button 
                      onClick={() => setActiveModule('bubbles')}
                      className={`${getCardStyle()} p-6 rounded-3xl text-left hover:scale-105 transition-all border-b-8 border-pink-400`}
                    >
                      <div className="text-4xl mb-3">🫧</div>
                      <h2 className="text-xl font-bold mb-1">Bolhas Sensoriais</h2>
                      <p className="text-sm opacity-75">Toque livre sem tempo ou regras. Estouro calmo e relaxante.</p>
                    </button>

                    <button 
                      onClick={() => setActiveModule('emotions')}
                      className={`${getCardStyle()} p-6 rounded-3xl text-left hover:scale-105 transition-all border-b-8 border-purple-400`}
                    >
                      <div className="text-4xl mb-3">😊</div>
                      <h2 className="text-xl font-bold mb-1">Expressar Sentimentos</h2>
                      <p className="text-sm opacity-75">Identifique e compartilhe como seu corpo está se sentindo agora.</p>
                    </button>

                    <button 
                      onClick={() => setActiveModule('routines')}
                      className={`${getCardStyle()} p-6 rounded-3xl text-left hover:scale-105 transition-all border-b-8 border-emerald-400`}
                    >
                      <div className="text-4xl mb-3">📅</div>
                      <h2 className="text-xl font-bold mb-1">Minha Rotina</h2>
                      <p className="text-sm opacity-75">Guia visual de tarefas diárias para organização passo a passo.</p>
                    </button>
                  </div>
                </div>
              )}

              {activeModule === 'bubbles' && (
                <div className={`${getCardStyle()} p-6 rounded-3xl min-h-[400px] relative`}>
                  <h2 className="text-2xl font-bold mb-4">🫧 Estourar Bolhas Calmas</h2>
                  <div 
                    className="w-full h-80 relative border-2 border-slate-200 rounded-2xl overflow-hidden bg-sky-50/30 cursor-pointer"
                    onClick={(e) => {
                      const rect = e.currentTarget.getBoundingClientRect();
                      createBubble(((e.clientX - rect.left) / rect.width) * 90, ((e.clientY - rect.top) / rect.height) * 80);
                    }}
                  >
                    {bubbles.map(b => (
                      <button
                        key={b.id}
                        onClick={(e) => {
                          e.stopPropagation();
                          handleBubbleClick(b.id);
                        }}
                        style={{
                          left: `${b.x}%`,
                          top: `${b.y}%`,
                          width: `${b.size}px`,
                          height: `${b.size}px`,
                          backgroundColor: b.color
                        }}
                        className="absolute rounded-full shadow-md border-2 border-white/60 hover:scale-110 active:scale-90 transition-transform"
                      />
                    ))}
                  </div>
                </div>
              )}

              {activeModule === 'emotions' && (
                <div className={`${getCardStyle()} p-6 rounded-3xl space-y-6`}>
                  <h2 className="text-2xl font-bold">😊 Como você está se sentindo agora?</h2>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {emotionsData.map(e => (
                      <button
                        key={e.id}
                        onClick={() => {
                          setSelectedEmotion(e);
                          audioSystem.playPop(1.2);
                        }}
                        className={`p-6 rounded-2xl border-4 text-center transition ${selectedEmotion.id === e.id ? 'border-indigo-500 bg-indigo-50 scale-105' : 'border-transparent bg-slate-100/50'}`}
                      >
                        <div className="text-5xl mb-2">{e.emoji}</div>
                        <div className="font-bold">{e.label}</div>
                      </button>
                    ))}
                  </div>
                  <div className="p-4 rounded-xl bg-indigo-50/50 border border-indigo-100 text-center">
                    <p className="text-xl font-bold mb-1">{selectedEmotion.emoji} {selectedEmotion.label}</p>
                    <p className="text-sm text-slate-600">{selectedEmotion.desc}</p>
                  </div>
                </div>
              )}

              {activeModule === 'routines' && (
                <div className={`${getCardStyle()} p-6 rounded-3xl space-y-4`}>
                  <h2 className="text-2xl font-bold mb-4">📅 Cartões de Rotina Diária</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {routines.map(r => (
                      <div 
                        key={r.id}
                        onClick={() => completeRoutine(r.id)}
                        className={`p-4 rounded-2xl border-2 cursor-pointer flex items-center justify-between transition ${r.completed ? 'bg-emerald-50 border-emerald-400 opacity-60' : 'bg-white border-slate-200'}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">{r.icon}</span>
                          <div>
                            <p className={`font-bold ${r.completed ? 'line-through' : ''}`}>{r.title}</p>
                            <span className="text-xs text-slate-500">{r.time}</span>
                          </div>
                        </div>
                        <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold ${r.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}`}>
                          {r.completed ? '✓' : ''}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {showParentModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${getCardStyle()} p-6 rounded-3xl max-w-md w-full space-y-4`}>
                <h3 className="text-xl font-bold">⚙️ Ajustes de Acessibilidade</h3>
                
                <div>
                  <label className="block text-sm font-bold mb-1">Nível de Suporte TEA:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[1, 2, 3].map(lvl => (
                      <button 
                        key={lvl}
                        onClick={() => setSupportLevel(lvl)}
                        className={`p-2 rounded-xl font-bold border ${supportLevel === lvl ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}
                      >
                        Nível {lvl}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-1">Tema Visual:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['pastel', 'dark', 'contrast'].map(t => (
                      <button 
                        key={t}
                        onClick={() => setThemeMode(t)}
                        className={`p-2 rounded-xl font-bold border capitalize ${themeMode === t ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                <button 
                  onClick={() => setShowParentModal(false)}
                  className="w-full py-3 bg-slate-800 text-white font-bold rounded-xl"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-sm opacity-70 py-4 border-t border-slate-200/40">
            <p>&copy; <span id="year"></span> Larissa da Silva Anastácio. Todos os direitos reservados.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
