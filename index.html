    // --- SISTEMA DE ÁUDIO MULTICAMADA E VOZ NATIVA ---
    class SensoryAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.currentAudio = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // REPRODUÇÃO DE VOZ NATIVA DO NAVEGADOR (GARANTIA DE SOM EM QUALQUER DISPOSITIVO)
      speak(text) {
        if (this.isMuted || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // Para qualquer fala anterior
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }

      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPop(pitchMultiplier = 1) {
        if (this.isMuted) return;
        const baseFreq = 320 * pitchMultiplier;
        this.playTone(baseFreq, 'sine', 0.15, 0.12);
      }

      playError() {
        if (this.isMuted) return;
        this.playTone(180, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.25, 0.15), 150);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, index) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.08);
          }, index * 90);
        });
      }

      playSynthAnimalSound(animalId) {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        switch (animalId) {
          case 'coruja':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
            break;
          case 'macaco':
            for (let i = 0; i < 4; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'triangle';
              o.frequency.setValueAtTime(600 + (i % 2 * 250), now + (i * 0.1));
              g.gain.setValueAtTime(0.15, now + (i * 0.1));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.08);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.1));
              o.stop(now + (i * 0.1) + 0.08);
            }
            break;
          case 'porco':
            osc.type = 'square';
            osc.frequency.setValueAtTime(140, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
          case 'pato':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(240, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
            break;
          case 'ovelha':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(200, now + 0.4);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
          case 'galo':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(750, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
          case 'elefante':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.linearRampToValueAtTime(580, now + 0.6);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
            break;
          case 'leao':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(90, now);
            osc.frequency.linearRampToValueAtTime(70, now + 0.8);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.start(now);
            osc.stop(now + 0.8);
            break;
          case 'cachorro':
            for (let i = 0; i < 2; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'sawtooth';
              o.frequency.setValueAtTime(280 + (i * 40), now + (i * 0.18));
              g.gain.setValueAtTime(0.2, now + (i * 0.18));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.18) + 0.12);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.18));
              o.stop(now + (i * 0.18) + 0.12);
            }
            break;
          case 'gato':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(400, now + 0.35);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
            break;
          case 'vaca':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            osc.start(now);
            osc.stop(now + 0.9);
            break;
          case 'cavalo':
            for (let i = 0; i < 4; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'sawtooth';
              o.frequency.setValueAtTime(550 - (i * 60), now + (i * 0.06));
              g.gain.setValueAtTime(0.15, now + (i * 0.06));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.05);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.06));
              o.stop(now + (i * 0.06) + 0.05);
            }
            break;
          default:
            this.playPop();
        }
      }

      // EXECUÇÃO DO SOM DOS ANIMAIS (MP3 LOCAL -> SINTETIZADOR -> VOZ NATIVA)
      playAnimalSound(animalObj) {
        if (this.isMuted) return;
        this.init();

        const animalKey = typeof animalObj === 'string' ? animalObj : animalObj.id;
        const animalName = typeof animalObj === 'object' ? animalObj.name : animalKey;
        const soundText = typeof animalObj === 'object' ? animalObj.soundText : '';

        // Toca o som sintetizado ou a fala nativa
        this.speak(`${animalName}! ${soundText}`);

        try {
          if (this.currentAudio) {
            this.currentAudio.pause();
            this.currentAudio.currentTime = 0;
          }

          const path = ANIMAL_AUDIO_FILES[animalKey];
          if (path) {
            const audio = new Audio(path);
            this.currentAudio = audio;
            audio.volume = 1.0;

            const promise = audio.play();
            if (promise !== undefined) {
              promise.catch(() => {
                this.playSynthAnimalSound(animalKey);
              });
            }
          } else {
            this.playSynthAnimalSound(animalKey);
          }
        } catch (e) {
          this.playSynthAnimalSound(animalKey);
        }
      }
    }

            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className={`${getCardStyle()} p-6 rounded-3xl max-w-md w-full space-y-4`}>
                <h3 className="text-xl font-bold">⚙️ Ajustes de Acessibilidade</h3>
                
                <div>
                  <label className="block text-sm font-bold mb-1">Nível de Suporte TEA:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[1, 2, 3].map(lvl => (
                      <button 
                        key={lvl}
                        onClick={() => setSupportLevel(lvl)}
                        className={`p-2 rounded-xl font-bold border ${supportLevel === lvl ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}
                      >
                        Nível {lvl}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-1">Tema Visual:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['pastel', 'dark', 'contrast'].map(t => (
                      <button 
                        key={t}
                        onClick={() => setThemeMode(t)}
                        className={`p-2 rounded-xl font-bold border capitalize ${themeMode === t ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                <button 
                  onClick={() => setShowParentModal(false)}
                  className="w-full py-3 bg-slate-800 text-white font-bold rounded-xl"
                >
                  Fechar
                </button>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-sm opacity-70 py-4 border-t border-slate-200/40">
            <p>&copy; <span id="year"></span> Larissa da Silva Anastácio. Todos os direitos reservados.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
