<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pop! & Ploft!</title>
  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, createElement: e } = React;

    // --- SÍNTESE ACÚSTICA ---
    class OrganicAudio {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTone(freq = 440, type = 'sine', duration = 0.3, volume = 0.1) {
        if (this.isMuted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (err) {}
      }
      playPop() { this.playTone(320, 'sine', 0.15, 0.12); }
      playError() {
        this.playTone(180, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(140, 'sawtooth', 0.25, 0.15), 150);
      }
      playSuccess() {
        [261.63, 329.63, 392.00, 523.25].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'sine', 0.4, 0.08), i * 90);
        });
      }
    }

    const audioSystem = new OrganicAudio();

    // DADOS COMPLETE A FRASE
    const fillSentenceData = [
      {
        id: 1,
        prefix: "Eu gosto de comer ",
        suffix: " no almoço.",
        options: [
          { text: "Maçã", icon: "🍎", isCorrect: true },
          { text: "Tênis", icon: "👟", isCorrect: false },
          { text: "Carro", icon: "🚗", isCorrect: false }
        ]
      },
      {
        id: 2,
        prefix: "O ",
        suffix: " faz au au no quintal.",
        options: [
          { text: "Flor", icon: "🌸", isCorrect: false },
          { text: "Cachorro", icon: "🐶", isCorrect: true },
          { text: "Avião", icon: "✈️", isCorrect: false }
        ]
      },
      {
        id: 3,
        prefix: "Antes de dormir, eu vou ",
        suffix: " meus dentes.",
        options: [
          { text: "Escovar", icon: "🪥", isCorrect: true },
          { text: "Correr", icon: "🏃", isCorrect: false },
          { text: "Desenhar", icon: "🎨", isCorrect: false }
        ]
      }
    ];

    // DADOS PEDIR AJUDA
    const helpTasksData = [
      {
        id: 'shoes',
        title: 'Amarrar o Tênis',
        icon: '👟',
        prompt: 'Quando você não consegue amarrar os cadarços, o que pode fazer?',
        options: [
          { text: '"Pode me ajudar a amarrar o tênis, por favor?"', icon: '💬', isHelpful: true, tip: 'Excelente! Pedir com gentileza ajuda o adulto a entender você.' },
          { text: 'Ficar bravo e jogar o tênis no chão', icon: '😠', isHelpful: false, tip: 'Respire fundo! Tente usar as palavras para pedir ajuda.' }
        ]
      },
      {
        id: 'teeth',
        title: 'Escovar os Dentes',
        icon: '🪥',
        prompt: 'Se a pasta de dentes está no alto e você não alcança:',
        options: [
          { text: '"Pode pegar a pasta de dentes para mim?"', icon: '🙋‍♂️', isHelpful: true, tip: 'Muito bem! Apontar ou pedir gentilmente funciona super bem!' },
          { text: 'Tentar subir em um lugar perigoso sozinho', icon: '⚠️', isHelpful: false, tip: 'Cuidado! Sempre peça para um adulto alcançar objetos altos.' }
        ]
      }
    ];

    const animals = [
      { name: 'Cavalo', icon: '🐴', freq: 650 },
      { name: 'Vaca', icon: '🐮', freq: 120 },
      { name: 'Cachorro', icon: '🐶', freq: 260 },
      { name: 'Gato', icon: '🐱', freq: 520 }
    ];

    function App() {
      const [module, setModule] = useState('home');

      // Complete a Frase
      const [sIndex, setSIndex] = useState(0);
      const [sOpt, setSOpt] = useState(null);
      const [sFeedback, setSFeedback] = useState(null);

      // Pedir Ajuda
      const [hIndex, setHIndex] = useState(0);
      const [hFeedback, setHFeedback] = useState(null);

      // Lousa
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [color, setColor] = useState('#4F46E5');
      const [size, setSize] = useState(6);

      useEffect(() => {
        if (module === 'drawing' && canvasRef.current) {
          const canvas = canvasRef.current;
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = 360;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }, [module]);

      // RENDER: HOME
      if (module === 'home') {
        return e('div', { className: 'max-w-4xl mx-auto space-y-6' },
          e('div', { className: 'text-center p-8 bg-white rounded-3xl shadow-md border-4 border-dashed border-pink-300' },
            e('h1', { className: 'text-4xl font-black mb-2 text-indigo-600' }, 'Mundo Pop! & Ploft!'),
            e('p', { className: 'font-semibold opacity-80' }, 'Escolha um jogo para aprender e se divertir!')
          ),
          e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            e('button', { onClick: () => setModule('fill'), className: 'p-6 bg-white rounded-3xl shadow border-b-8 border-violet-400 text-left hover:scale-102 transition' },
              e('div', { className: 'text-4xl mb-2' }, '✍️'),
              e('h2', { className: 'text-xl font-bold' }, 'Complete a Frase'),
              e('p', { className: 'text-sm opacity-75' }, 'Escolha a opção correta para a história.')
            ),
            e('button', { onClick: () => setModule('help'), className: 'p-6 bg-white rounded-3xl shadow border-b-8 border-teal-400 text-left hover:scale-102 transition' },
              e('div', { className: 'text-4xl mb-2' }, '🤝'),
              e('h2', { className: 'text-xl font-bold' }, 'Como Pedir Ajuda'),
              e('p', { className: 'text-sm opacity-75' }, 'Aprenda a pedir apoio em várias tarefas.')
            ),
            e('button', { onClick: () => setModule('drawing'), className: 'p-6 bg-white rounded-3xl shadow border-b-8 border-rose-400 text-left hover:scale-102 transition' },
              e('div', { className: 'text-4xl mb-2' }, '🎨'),
              e('h2', { className: 'text-xl font-bold' }, 'Lousa Mágica'),
              e('p', { className: 'text-sm opacity-75' }, 'Desenhe tudo que vier na imaginação!')
            ),
            e('button', { onClick: () => setModule('animals'), className: 'p-6 bg-white rounded-3xl shadow border-b-8 border-emerald-400 text-left hover:scale-102 transition' },
              e('div', { className: 'text-4xl mb-2' }, '🔊'),
              e('h2', { className: 'text-xl font-bold' }, 'Sons dos Animais'),
              e('p', { className: 'text-sm opacity-75' }, 'Ouça os sons dos bichinhos.')
            )
          )
        );
      }

      // RENDER: COMPLETE A FRASE
      if (module === 'fill') {
        const cur = fillSentenceData[sIndex];
        return e('div', { className: 'max-w-3xl mx-auto bg-white p-6 rounded-3xl shadow space-y-6' },
          e('div', { className: 'flex justify-between items-center' },
            e('h2', { className: 'text-2xl font-bold' }, '✍️ Complete a Frase'),
            e('button', { onClick: () => setModule('home'), className: 'px-4 py-2 bg-slate-100 rounded-xl font-bold' }, '🏠 Início')
          ),
          e('div', { className: 'p-6 bg-slate-50 border-4 border-dashed border-violet-200 rounded-2xl text-center' },
            e('p', { className: 'text-2xl font-black' },
              cur.prefix,
              e('span', { className: 'px-3 py-1 mx-2 bg-white border-b-4 border-violet-500 rounded text-violet-600' }, sOpt ? `${sOpt.icon} ${sOpt.text}` : '_____'),
              cur.suffix
            )
          ),
          e('div', { className: 'grid grid-cols-3 gap-4' },
            cur.options.map((opt, i) => e('button', {
              key: i,
              onClick: () => {
                setSOpt(opt);
                if (opt.isCorrect) { setSFeedback('ok'); audioSystem.playSuccess(); }
                else { setSFeedback('err'); audioSystem.playError(); }
              },
              className: 'p-4 border-4 rounded-2xl text-center bg-white hover:scale-105 transition'
            }, e('div', { className: 'text-4xl' }, opt.icon), e('div', { className: 'font-bold' }, opt.text)))
          ),
          sFeedback === 'ok' && e('div', { className: 'p-4 bg-emerald-100 text-emerald-900 rounded-2xl text-center space-y-2' },
            e('h3', { className: 'text-xl font-bold' }, '🎉 Parabéns! Você acertou!'),
            e('button', { onClick: () => { setSOpt(null); setSFeedback(null); setSIndex((sIndex + 1) % fillSentenceData.length); }, className: 'px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl' }, 'Próxima Frase')
          ),
          sFeedback === 'err' && e('div', { className: 'p-4 bg-rose-100 text-rose-900 rounded-2xl text-center' },
            e('h3', { className: 'font-bold' }, '🤔 Ops! Tente outra opção.')
          )
        );
      }

      // RENDER: PEDIR AJUDA
      if (module === 'help') {
        const cur = helpTasksData[hIndex];
        return e('div', { className: 'max-w-3xl mx-auto bg-white p-6 rounded-3xl shadow space-y-6' },
          e('div', { className: 'flex justify-between items-center' },
            e('h2', { className: 'text-2xl font-bold' }, '🤝 Como Pedir Ajuda'),
            e('button', { onClick: () => setModule('home'), className: 'px-4 py-2 bg-slate-100 rounded-xl font-bold' }, '🏠 Início')
          ),
          e('div', { className: 'p-4 bg-teal-50 rounded-2xl' },
            e('h3', { className: 'text-lg font-bold text-teal-900' }, `${cur.icon} ${cur.title}`),
            e('p', { className: 'font-semibold text-slate-700 mt-1' }, cur.prompt)
          ),
          e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            cur.options.map((opt, i) => e('button', {
              key: i,
              onClick: () => {
                setHFeedback(opt);
                if (opt.isHelpful) audioSystem.playSuccess(); else audioSystem.playError();
              },
              className: 'p-4 border-2 rounded-2xl text-left bg-white hover:border-teal-400 flex items-center gap-3'
            }, e('span', { className: 'text-3xl' }, opt.icon), e('span', { className: 'font-bold' }, opt.text)))
          ),
          hFeedback && e('div', { className: `p-4 rounded-2xl text-center space-y-2 ${hFeedback.isHelpful ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'}` },
            e('p', { className: 'font-bold' }, hFeedback.tip),
            e('button', { onClick: () => { setHFeedback(null); setHIndex((hIndex + 1) % helpTasksData.length); }, className: 'px-4 py-2 bg-slate-800 text-white font-bold rounded-xl' }, 'Próxima Situação')
          )
        );
      }

      // RENDER: LOUSA MÁGICA
      if (module === 'drawing') {
        return e('div', { className: 'max-w-3xl mx-auto bg-white p-6 rounded-3xl shadow space-y-4' },
          e('div', { className: 'flex justify-between items-center' },
            e('h2', { className: 'text-2xl font-bold' }, '🎨 Lousa Mágica'),
            e('div', { className: 'flex gap-2' },
              e('button', { onClick: () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }, className: 'px-3 py-1 bg-rose-500 text-white font-bold rounded-xl' }, '🗑️ Limpar'),
              e('button', { onClick: () => setModule('home'), className: 'px-4 py-2 bg-slate-100 rounded-xl font-bold' }, '🏠 Início')
            )
          ),
          e('div', { className: 'flex gap-2 items-center bg-slate-100 p-2 rounded-xl' },
            ['#4F46E5', '#EF4444', '#10B981', '#F59E0B', '#000000'].map(c => e('button', {
              key: c,
              onClick: () => setColor(c),
              style: { backgroundColor: c },
              className: `w-6 h-6 rounded-full border-2 border-white ${color === c ? 'scale-125' : ''}`
            }))
          ),
          e('div', { className: 'border-4 border-indigo-200 rounded-2xl overflow-hidden' },
            e('canvas', {
              ref: canvasRef,
              onMouseDown: (ev) => {
                const ctx = canvasRef.current.getContext('2d');
                const r = canvasRef.current.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(ev.clientX - r.left, ev.clientY - r.top);
                setIsDrawing(true);
              },
              onMouseMove: (ev) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                const r = canvasRef.current.getBoundingClientRect();
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineTo(ev.clientX - r.left, ev.clientY - r.top);
                ctx.stroke();
              },
              onMouseUp: () => setIsDrawing(false),
              onTouchStart: (ev) => {
                const ctx = canvasRef.current.getContext('2d');
                const r = canvasRef.current.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(ev.touches[0].clientX - r.left, ev.touches[0].clientY - r.top);
                setIsDrawing(true);
              },
              onTouchMove: (ev) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                const r = canvasRef.current.getBoundingClientRect();
                ctx.strokeStyle = color;
                ctx.lineWidth = size;
                ctx.lineTo(ev.touches[0].clientX - r.left, ev.touches[0].clientY - r.top);
                ctx.stroke();
              },
              onTouchEnd: () => setIsDrawing(false),
              className: 'w-full touch-none cursor-crosshair'
            })
          )
        );
      }

      // RENDER: SONS ANIMAIS
      if (module === 'animals') {
        return e('div', { className: 'max-w-3xl mx-auto bg-white p-6 rounded-3xl shadow space-y-6' },
          e('div', { className: 'flex justify-between items-center' },
            e('h2', { className: 'text-2xl font-bold' }, '🔊 Sons dos Animais'),
            e('button', { onClick: () => setModule('home'), className: 'px-4 py-2 bg-slate-100 rounded-xl font-bold' }, '🏠 Início')
          ),
          e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-4' },
            animals.map((a, i) => e('button', {
              key: i,
              onClick: () => audioSystem.playTone(a.freq, 'sawtooth', 0.4, 0.2),
              className: 'p-6 bg-slate-50 border-2 rounded-2xl text-center hover:scale-105 transition'
            }, e('div', { className: 'text-5xl mb-2' }, a.icon), e('div', { className: 'font-bold' }, a.name)))
          )
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
