<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Pop! & Ploft!</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SISTEMA DE ÁUDIO DIRETO E CONTEXTO DE SOM ---
    class AnimalSoundPlayer {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop(pitch = 1) {
        if (this.isMuted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320 * pitch, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playSuccess() {
        if (this.isMuted) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
          }, idx * 90);
        });
      }

      playError() {
        if (this.isMuted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }

      // EXECUTA O SOM ESPECÍFICO DO ANIMAL AO CLICAR NA IMAGEM
      playAnimalSound(animalId) {
        if (this.isMuted) return;
        this.init();

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        switch (animalId) {
          case 'coruja':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
            break;

          case 'macaco':
            for (let i = 0; i < 4; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'triangle';
              o.frequency.setValueAtTime(600 + (i % 2 * 250), now + (i * 0.1));
              g.gain.setValueAtTime(0.15, now + (i * 0.1));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.08);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.1));
              o.stop(now + (i * 0.1) + 0.08);
            }
            break;

          case 'porco':
            osc.type = 'square';
            osc.frequency.setValueAtTime(140, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            break;

          case 'pato':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(240, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
            break;

          case 'ovelha':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(200, now + 0.4);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;

          case 'galo':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(750, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;

          case 'elefante':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(480, now);
            osc.frequency.linearRampToValueAtTime(580, now + 0.6);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
            break;

          case 'leao':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(90, now);
            osc.frequency.linearRampToValueAtTime(70, now + 0.8);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.start(now);
            osc.stop(now + 0.8);
            break;

          case 'cachorro':
            for (let i = 0; i < 2; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'sawtooth';
              o.frequency.setValueAtTime(280 + (i * 40), now + (i * 0.18));
              g.gain.setValueAtTime(0.2, now + (i * 0.18));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.18) + 0.12);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.18));
              o.stop(now + (i * 0.18) + 0.12);
            }
            break;

          case 'gato':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(400, now + 0.35);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
            break;

          case 'vaca':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            osc.start(now);
            osc.stop(now + 0.9);
            break;

          case 'cavalo':
            for (let i = 0; i < 4; i++) {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'sawtooth';
              o.frequency.setValueAtTime(550 - (i * 60), now + (i * 0.06));
              g.gain.setValueAtTime(0.15, now + (i * 0.06));
              g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.05);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + (i * 0.06));
              o.stop(now + (i * 0.06) + 0.05);
            }
            break;

          default:
            this.playPop();
        }
      }
    }

    const soundSystem = new AnimalSoundPlayer();

    // --- LISTA DOS ANIMAIS COM AUDIOS CONFIGURADOS ---
    const animalList = [
      { id: 'coruja', name: 'Coruja', emoji: '🦉', soundText: 'Uuuu Uuuu' },
      { id: 'macaco', name: 'Macaco', emoji: '🐵', soundText: 'Uh Uh Ah Ah' },
      { id: 'porco', name: 'Porco', emoji: '🐷', soundText: 'Oinc Oinc' },
      { id: 'pato', name: 'Pato', emoji: '🦆', soundText: 'Quack Quack' },
      { id: 'ovelha', name: 'Ovelha', emoji: '🐑', soundText: 'Meee Meee' },
      { id: 'galo', name: 'Galo', emoji: '🐓', soundText: 'Cocoricó' },
      { id: 'elefante', name: 'Elefante', emoji: '🐘', soundText: 'Fuuuuh' },
      { id: 'leao', name: 'Leão', emoji: '🦁', soundText: 'Roaaarrr' },
      { id: 'cachorro', name: 'Cachorro', emoji: '🐶', soundText: 'Au Au' },
      { id: 'gato', name: 'Gato', emoji: '🐱', soundText: 'Miau' },
      { id: 'vaca', name: 'Vaca', emoji: '🐮', soundText: 'Muuuu' },
      { id: 'cavalo', name: 'Cavalo', emoji: '🐴', soundText: 'Riiiii-hó' }
    ];

    function App() {
      const [activeModule, setActiveModule] = useState('home');
      const [activeAnimalId, setActiveAnimalId] = useState(null);
      const [isMuted, setIsMuted] = useState(false);

      useEffect(() => {
        soundSystem.isMuted = isMuted;
      }, [isMuted]);

      const handleAnimalClick = (animal) => {
        setActiveAnimalId(animal.id);
        soundSystem.playAnimalSound(animal.id);
        setTimeout(() => setActiveAnimalId(null), 1000);
      };

      return (
        <div className="min-h-screen bg-amber-50 text-slate-800 p-4 md:p-8">
          <header className="flex justify-between items-center max-w-6xl mx-auto mb-6">
            <h1 
              onClick={() => setActiveModule('home')}
              className="text-3xl font-black text-indigo-600 cursor-pointer"
            >
              Mundo Pop! & Ploft!
            </h1>
            <div className="flex gap-3">
              {activeModule !== 'home' && (
                <button 
                  onClick={() => setActiveModule('home')}
                  className="px-4 py-2 bg-slate-200 rounded-xl font-bold"
                >
                  🏠 Início
                </button>
              )}
              <button 
                onClick={() => setIsMuted(!isMuted)}
                className="px-4 py-2 bg-indigo-100 text-indigo-700 rounded-xl font-bold"
              >
                {isMuted ? '🔇 Mudo' : '🔊 Som Ligado'}
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto">
            {activeModule === 'home' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <button 
                  onClick={() => setActiveModule('animal-sounds')}
                  className="p-8 bg-white border-b-8 border-emerald-400 rounded-3xl shadow-md text-left hover:scale-105 transition"
                >
                  <div className="text-5xl mb-3">🔊</div>
                  <h2 className="text-2xl font-bold">Sons dos Animais</h2>
                  <p className="text-sm opacity-75">Clique na imagem do animal para ouvir o som exato que ele faz!</p>
                </button>
              </div>
            )}

            {activeModule === 'animal-sounds' && (
              <div className="bg-white p-6 rounded-3xl shadow-md space-y-6">
                <div>
                  <h2 className="text-2xl font-bold">🔊 Sons dos Animais</h2>
                  <p className="text-sm text-slate-600">Clique sobre cada imagem para emitir o som correspondente:</p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                  {animalList.map((animal) => {
                    const isActive = activeAnimalId === animal.id;
                    return (
                      <button
                        key={animal.id}
                        onClick={() => handleAnimalClick(animal)}
                        className={`p-6 rounded-3xl border-4 text-center transition-all flex flex-col items-center justify-center gap-2 select-none cursor-pointer ${
                          isActive 
                            ? 'border-emerald-500 bg-emerald-50 scale-105 shadow-xl ring-4 ring-emerald-300' 
                            : 'border-slate-100 bg-white hover:border-emerald-200 hover:scale-105 shadow-sm'
                        }`}
                      >
                        <div className={`text-6xl transition-transform ${isActive ? 'animate-bounce' : ''}`}>
                          {animal.emoji}
                        </div>
                        <div className="font-bold text-lg text-slate-800">{animal.name}</div>
                        <div className={`text-xs font-black px-3 py-1 rounded-full ${isActive ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                          {animal.soundText}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
